<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova AI</title><script src="https://js.puter.com/v2/"></script><style>:root{--bg:#0b0d12;--p:#131720;--p2:#1b202b;--b:#2b3340;--t:#f5f7fb;--m:#8993a4;--a:#8b7cff}*{box-sizing:border-box}body{margin:0;height:100vh;background:var(--bg);color:var(--t);font:14px system-ui;display:flex}.side{width:270px;border-right:1px solid var(--b);padding:14px;display:flex;flex-direction:column;gap:10px}.brand{font-size:20px;font-weight:800;padding:8px}.new,.search,.model,.icon,.send,.suggestion{border:1px solid var(--b);background:var(--p);color:var(--t);border-radius:11px;padding:11px}.new,.suggestion,.icon,.send{cursor:pointer}.search{outline:0}.list{overflow:auto}.chat{padding:10px;border-radius:9px;color:var(--m);cursor:pointer}.chat.active,.chat:hover{background:var(--p2);color:var(--t)}.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:62px;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.left,.right{display:flex;align-items:center;gap:9px}.model{padding:8px;max-width:220px}.icon{padding:9px}.msgs{flex:1;overflow:auto;padding:30px 18px 150px}.empty{max-width:780px;margin:12vh auto;text-align:center}.logo{width:58px;height:58px;margin:auto;border-radius:19px;background:linear-gradient(135deg,#8b7cff,#55e6cf);color:#090b10;display:grid;place-items:center;font-size:25px;font-weight:900}.empty h1{font-size:42px;margin:16px 0 8px}.empty p{color:var(--m)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}.msg{max-width:900px;margin:0 auto 25px;display:flex;gap:12px}.ava{width:34px;height:34px;border-radius:10px;background:var(--p2);display:grid;place-items:center;flex:none;font-weight:800}.ai .ava{background:linear-gradient(135deg,#8b7cff,#55e6cf);color:#090b10}.bubble{line-height:1.7;white-space:pre-wrap;word-break:break-word}.user .bubble{background:var(--p2);padding:10px 13px;border-radius:13px}.bubble pre{white-space:pre-wrap;background:#080a0e;padding:12px;border:1px solid var(--b);border-radius:9px;overflow:auto}.composer{position:fixed;left:270px;right:0;bottom:0;padding:16px 20px;background:linear-gradient(transparent,var(--bg) 30%)}form{max-width:900px;margin:auto;background:var(--p);border:1px solid var(--b);border-radius:17px;padding:9px;display:flex;gap:8px}.input{flex:1;background:transparent;border:0;outline:0;color:var(--t);font:inherit;resize:none;padding:9px;max-height:150px}.send{background:var(--t);color:var(--bg);width:42px}.hint{text-align:center;color:var(--m);font-size:10px;margin-top:6px}@media(max-width:700px){.side{position:fixed;z-index:5;height:100%;transform:translateX(-105%);transition:.2s;background:var(--bg)}.side.open{transform:none}.composer{left:0;padding:10px}.mobile{display:block!important}.grid{grid-template-columns:1fr}.empty h1{font-size:32px}.msgs{padding-bottom:140px}.top{padding:0 10px}.model{max-width:150px}}.mobile{display:none}</style></head><body><aside class="side" id="side"><div class="brand">✦ Nova AI</div><button class="new" id="new">＋ New chat</button><input class="search" id="search" placeholder="Search chats"><div class="list" id="list"></div><small style="color:var(--m);margin-top:auto">Powered by <a href="https://developer.puter.com" target="_blank" style="color:#a99fff">Puter.js</a></small></aside><main class="main"><header class="top"><div class="left"><button class="icon mobile" id="menu">☰</button><b>AI Chat</b><small id="status" style="color:var(--m)">Ready</small></div><div class="right"><select class="model" id="model"><option value="gpt-5.6-luna">GPT-5.6 Luna</option><option value="claude-sonnet-4-6">Claude Sonnet 4.6</option><option value="gemini-3.1-flash-lite">Gemini 3.1 Flash Lite</option></select><button class="icon" id="theme">☼</button></div></header><section class="msgs" id="msgs"></section><div class="composer"><form id="form"><textarea class="input" id="input" rows="1" placeholder="Message Nova AI…"></textarea><button class="send" id="send">↑</button></form><div class="hint">Enter to send · Shift+Enter for new line</div></div></main><script>const K="nova-ai-chats",T="nova-ai-theme";let chats=JSON.parse(localStorage.getItem(K)||"[]"),active=chats[0]?.id,busy=false;const $=x=>document.getElementById(x);function save(){localStorage.setItem(K,JSON.stringify(chats))}function cur(){return chats.find(x=>x.id===active)}function fresh(){const c={id:crypto.randomUUID(),title:"New chat",messages:[]};chats.unshift(c);active=c.id;save();draw()}function drawList(){const q=$("search").value.toLowerCase();$("list").innerHTML="";chats.filter(c=>c.title.toLowerCase().includes(q)).forEach(c=>{const d=document.createElement("div");d.className="chat"+(c.id===active?" active":"");d.textContent=c.title;d.onclick=()=>{active=c.id;draw()};$("list").appendChild(d)})}function esc(s){return String(s).replace(/[&<>]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[x]))}function draw(){drawList();const c=cur();if(!c||!c.messages.length){$("msgs").innerHTML="<div class="empty"><div class="logo">N</div><h1>How can I help?</h1><p>Ask anything, build projects, debug code, or create content.</p><div class="grid"><button class="suggestion">Build a Java Spring Boot project</button><button class="suggestion">Explain React useState</button><button class="suggestion">Write a professional client message</button><button class="suggestion">Create a coding plan</button></div></div>";document.querySelectorAll(".suggestion").forEach(x=>x.onclick=()=>{$("input").value=x.textContent;send()});return}$("msgs").innerHTML=c.messages.map(m=>"<div class="msg "+m.role+""><div class="ava">"+(m.role==="user"?"You":"N")+"</div><div class="bubble">"+esc(m.content)+"</div></div>").join("");$("msgs").scrollTop=$("msgs").scrollHeight}async function send(){if(busy)return;const v=$("input").value.trim();if(!v)return;$("input").value="";if(!cur())fresh();const c=cur();if(!c.messages.length)c.title=v.slice(0,42);c.messages.push({role:"user",content:v});c.messages.push({role:"assistant",content:""});const i=c.messages.length-1;save();draw();busy=true;$("send").disabled=true;$("status").textContent="Thinking…";try{const history=c.messages.slice(0,i).map(m=>({role:m.role,content:m.content}));const r=await puter.ai.chat(history,{model:$("model").value,stream:true,compaction:true});for await(const p of r){if(p.type==="text"&&p.text){c.messages[i].content+=p.text;draw()}}save();$("status").textContent="Ready"}catch(e){c.messages[i].content="Sorry — "+(e.message||"AI request failed");draw();$("status").textContent="Error"}finally{busy=false;$("send").disabled=false}}$("form").onsubmit=e=>{e.preventDefault();send()};$("input").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};$("new").onclick=fresh;$("search").oninput=drawList;$("menu").onclick=()=>$("side").classList.toggle("open");$("theme").onclick=()=>{const x=document.documentElement.dataset.theme==="light"?"dark":"light";document.documentElement.dataset.theme=x;localStorage.setItem(T,x)};if(localStorage.getItem(T)==="light")document.documentElement.dataset.theme="light";if(!chats.length)fresh();else draw();</script></body></html>
